[package]
name = "{{rust-name}}"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "{{rust-name-snake-case}}"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["idl-build"]
test-sbf = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "{{anchor-version}}"
light-sdk = { version = "{{light-sdk-version}}", features = ["anchor"] }
light-hasher = { version = "{{light-hasher-version}}", features = ["solana"] }
light-sdk-types = { version = "{{light-sdk-version}}" }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sdk = "{{solana-sdk-version}}"

[dev-dependencies]
light-client = { version = "{{light-sdk-version}}" }
light-program-test = { version = "{{light-sdk-version}}" }
tokio = "{{tokio-version}}"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
